name: Build signed Jogos Retro APK
on:
  workflow_dispatch:
    inputs:
      cloud_origin:
        description: HTTPS origin of the published Cloudflare Worker
        required: true
        type: string
      version_name:
        description: Optional display version override
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android build dependencies
        run: sdkmanager 'platform-tools' 'platforms;android-28' 'build-tools;35.0.0'
      - name: Restore release keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.FIRERETRO_KEYSTORE_B64 }}
        run: |
          test -n "$KEYSTORE_B64"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/fireretro-release.jks"
      - name: Build and sign APK
        shell: pwsh
        env:
          FIRERETRO_KEYSTORE: ${{ runner.temp }}/fireretro-release.jks
          FIRERETRO_KEY_ALIAS: ${{ secrets.FIRERETRO_KEY_ALIAS }}
          FIRERETRO_KEY_PASSWORD: ${{ secrets.FIRERETRO_KEY_PASSWORD }}
        run: |
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          ./launcher-android/scripts/Build-FireRetro.ps1 -SdkRoot $sdk -JavaRoot $env:JAVA_HOME -CloudOrigin '${{ inputs.cloud_origin }}'
      - name: Verify stable signer and package
        shell: pwsh
        env:
          EXPECTED: ${{ secrets.FIRERETRO_SIGNER_SHA256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:EXPECTED)) { throw 'FIRERETRO_SIGNER_SHA256 is required' }
          $apk = Get-ChildItem launcher-android/build -Recurse -Filter Jogos-Retro.apk | Sort-Object LastWriteTime | Select-Object -Last 1
          if ($null -eq $apk) { throw 'Signed APK was not produced' }
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          $apksigner = Join-Path $sdk 'build-tools\35.0.0\apksigner.bat'
          $certs = & $apksigner verify --print-certs $apk.FullName
          if ($LASTEXITCODE -ne 0 -or ($certs -notmatch [regex]::Escape("SHA-256 digest: $($env:EXPECTED)"))) { throw 'The APK signer does not match FIRERETRO_SIGNER_SHA256' }
      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jogos-retro-signed-apk
          path: launcher-android/build/**/Jogos-Retro.apk
          if-no-files-found: error
